<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lender Dashboard | ContractFlow</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="ContractFlow Logo">
                <span>ContractFlow</span>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                    <li><a href="new-contract.html"><i class="fa-solid fa-file-signature"></i> Apply Loan</a></li>
                    <li><a href="dashboard.html" class="active"><i class="fa-solid fa-table-columns"></i> Lender Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container dashboard-main">
        <div class="dashboard-header">
            <div>
                <h1 style="font-family: var(--font-serif); font-size: 2rem; font-weight: 700; color: #ffffff;">Lender Review Dashboard</h1>
                <p style="color: var(--text-muted); font-size: 0.9375rem;">Review loan applications, approve requests, and send digital contracts.</p>
            </div>
            <a href="new-contract.html" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> New Application
            </a>
        </div>

        <div class="dashboard-controls">
            <div class="search-bar">
                <div class="search-input-wrap">
                    <input type="text" class="form-control search-input" placeholder="Search borrowers...">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                </div>
            </div>
            <button class="btn btn-secondary filter-btn"><i class="fa-solid fa-filter"></i> Filter</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Borrower</th>
                        <th>Loan Amount</th>
                        <th>Term</th>
                        <th>Interest</th>
                        <th>Status</th>
                        <th>Date Submitted</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="loanRequestsTableBody">
                    <!-- Mock data injected by JS -->
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 4rem; color: var(--text-muted);">
                            <i class="fa-solid fa-folder-open" style="font-size: 2rem; display: block; margin-bottom: 1rem; opacity: 0.5;"></i>
                            No loan requests found. <a href="new-contract.html" style="color: var(--accent); font-weight: 600;">Create one now</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
