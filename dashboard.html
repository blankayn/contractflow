<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ContractFlow</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-canvas">
        <iframe class="spline-iframe" src="https://my.spline.design/copy-r7EDDtjbL0PECKddyI3Adsd2/" frameborder="0" title="Spline Background"></iframe>
    </div>
    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="ContractFlow Logo">
                <span>ContractFlow</span>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                    <li><a href="new-contract.html"><i class="fa-solid fa-file-signature"></i> New Contract</a></li>
                    <li><a href="dashboard.html" class="active"><i class="fa-solid fa-table-columns"></i> Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 3rem;">
        <div class="dashboard-header">
            <div>
                <h1 style="font-family: var(--font-serif); font-size: 2rem; font-weight: 700; color: #ffffff;">Contracts Dashboard</h1>
                <p style="color: var(--text-muted); font-size: 0.9375rem;">Manage and track all your sent legal documents.</p>
            </div>
            <a href="new-contract.html" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> New Contract
            </a>
        </div>

        <div style="margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center;">
            <div class="search-bar">
                <input type="text" class="form-control" placeholder="Search contracts..." style="padding-left: 2.5rem; position: relative;">
                <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 2.5rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
            </div>
            <button class="btn btn-secondary" style="padding: 0.75rem;"><i class="fa-solid fa-filter"></i> Filter</button>
        </div>

        <div class="table-container" style="background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(0, 217, 255, 0.2); box-shadow: 0 8px 32px rgba(0, 217, 255, 0.1);">
            <table>
                <thead>
                    <tr>
                        <th>Recipient</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Date Sent</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="contractsTableBody">
                    <!-- Mock data injected by JS -->
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 4rem; color: var(--text-muted);">
                            <i class="fa-solid fa-folder-open" style="font-size: 2rem; display: block; margin-bottom: 1rem; opacity: 0.5;"></i>
                            No contracts found. <a href="new-contract.html" style="color: var(--accent); font-weight: 600;">Create one now</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
